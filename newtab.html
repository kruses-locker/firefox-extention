<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Top Bar: Watchlist Trigger & Theme / Wallpaper / Backup Controls -->
  <header class="top-bar">
    <div class="top-bar-left">
      <button
        type="button"
        id="watchlistTrigger"
        class="glass-pill-btn"
        aria-haspopup="dialog"
        aria-expanded="false"
        aria-controls="watchlistDrawer"
      >
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="2"></rect>
          <line x1="7" y1="4" x2="7" y2="20"></line>
          <line x1="17" y1="4" x2="17" y2="20"></line>
          <line x1="2" y1="12" x2="22" y2="12"></line>
        </svg>
        <span>Watchlist</span>
        <span id="watchlistCount" class="watchlist-count-badge">0</span>
      </button>
    </div>

    <div class="top-bar-right">
      <div id="themeSwitcherWrap" class="theme-switcher-wrap">
        <button
          type="button"
          id="themeTrigger"
          class="glass-pill-btn"
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="themePopover"
          title="Customize Theme, Wallpaper & Backup"
        >
          <span id="themeTriggerDot" class="theme-trigger-dot"></span>
          <span>Customize</span>
        </button>

        <div
          id="themePopover"
          class="theme-popover"
          role="dialog"
          aria-label="Theme and Appearance Settings"
          aria-hidden="true"
        >
          <div>
            <div class="popover-section-title">Color Theme</div>
            <div id="themePresetsList" class="theme-presets-list" role="radiogroup" aria-label="Color Theme Presets"></div>
          </div>

          <div class="custom-accent-row">
            <span>Custom Accent</span>
            <div class="custom-accent-controls">
              <span id="customAccentHex" class="custom-accent-hex">#e11d48</span>
              <input type="color" id="customAccentInput" value="#e11d48" aria-label="Pick custom accent color" />
            </div>
          </div>

          <div class="wallpaper-controls">
            <div class="popover-section-title">Custom Wallpaper</div>
            <div class="wallpaper-btn-row">
              <label for="wallpaperFileInput" class="popover-mini-btn">Upload Image</label>
              <input type="file" id="wallpaperFileInput" accept="image/*" hidden />
              <button type="button" id="wallpaperClearBtn" class="popover-mini-btn">Clear</button>
            </div>

            <div class="slider-row">
              <div class="slider-header">
                <span>Dim Overlay</span>
                <span id="wallpaperDimValue">55%</span>
              </div>
              <input type="range" id="wallpaperDimInput" min="0" max="90" value="55" aria-label="Wallpaper dim overlay" />
            </div>

            <div class="slider-row">
              <div class="slider-header">
                <span>Blur</span>
                <span id="wallpaperBlurValue">2px</span>
              </div>
              <input type="range" id="wallpaperBlurInput" min="0" max="20" value="2" aria-label="Wallpaper blur amount" />
            </div>
          </div>

          <div>
            <div class="popover-section-title">Settings Backup</div>
            <div class="backup-btn-row">
              <button type="button" id="backupExportBtn" class="popover-mini-btn">Export JSON</button>
              <button type="button" id="backupImportBtn" class="popover-mini-btn">Import JSON</button>
              <input type="file" id="backupImportInput" accept="application/json,.json" hidden />
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Stage: Rainmeter Clock, Multi-Engine Search, Playlists Shelf, Shortcuts Grid -->
  <main class="main-stage">
    <!-- Overlapping Rainmeter-Style Clock -->
    <section class="clock-hero" aria-label="Clock and Date">
      <div id="clockTime" class="clock-time">00:00</div>
      <div class="clock-date-overlay">
        <span id="clockDay" class="clock-day">Friday</span>
        <span id="clockDate" class="clock-date">27 November 2026</span>
      </div>
    </section>

    <!-- Multi-Engine Search Bar -->
    <section class="search-container" aria-label="Web Search">
      <form id="searchForm" class="search-form" autocomplete="off">
        <div id="searchEngineSelector" class="search-engine-selector">
          <button
            type="button"
            id="searchEngineTrigger"
            class="search-engine-trigger"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="searchEngineMenu"
            title="Switch Search Engine"
          ></button>
          <div
            id="searchEngineMenu"
            class="search-engine-menu"
            role="listbox"
            aria-label="Search Engines"
            aria-hidden="true"
          ></div>
        </div>

        <span id="searchEngineBadge" class="search-engine-badge"></span>

        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search DuckDuckGo or enter URL..."
          aria-label="Search query or URL"
          spellcheck="false"
        />

        <button
          type="submit"
          id="searchSubmitBtn"
          class="search-submit-btn"
          aria-label="Search"
          title="Search"
        >
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>
    </section>

    <!-- YouTube Music Playlists Shelf -->
    <section
      id="playlistsShelf"
      class="playlists-shelf"
      role="list"
      aria-label="YouTube Music Playlists"
    ></section>

    <!-- Clean Borderless Shortcuts Grid -->
    <section
      id="shortcutsGrid"
      class="shortcuts-grid"
      role="list"
      aria-label="Pinned and Frequent Shortcuts"
    ></section>
  </main>

  <!-- Live Floating YouTube Music Mini-Player -->
  <aside
    id="ytmMiniPlayer"
    class="ytm-mini-player"
    aria-label="YouTube Music Live Mini-Player"
  ></aside>

  <!-- TMDB Movie Watchlist Slide-Over Drawer -->
  <div id="watchlistBackdrop" class="watchlist-backdrop" aria-hidden="true"></div>
  <aside
    id="watchlistDrawer"
    class="watchlist-drawer"
    role="dialog"
    aria-modal="true"
    aria-label="Movie Watchlist"
    aria-hidden="true"
  >
    <div class="drawer-header">
      <h2 class="drawer-title">Movie Watchlist</h2>
      <button type="button" id="watchlistCloseBtn" class="drawer-close-btn" aria-label="Close Watchlist">×</button>
    </div>

    <div class="watchlist-tabs" role="tablist" aria-label="Watchlist Filter">
      <button
        type="button"
        id="tabToWatch"
        class="watchlist-tab-btn active"
        role="tab"
        aria-selected="true"
      >
        <span>To Watch</span>
        <span id="toWatchTabCount" class="tab-count-pill">0</span>
      </button>
      <button
        type="button"
        id="tabWatched"
        class="watchlist-tab-btn"
        role="tab"
        aria-selected="false"
      >
        <span>Watched</span>
        <span id="watchedTabCount" class="tab-count-pill">0</span>
      </button>
    </div>

    <form id="watchlistAddForm" class="watchlist-add-form" autocomplete="off">
      <div id="watchlistSearchWrap" class="watchlist-search-wrap">
        <input
          type="text"
          id="movieTitleInput"
          class="drawer-input"
          placeholder="Search TMDB or enter movie title..."
          aria-label="Movie title"
          required
        />
        <button type="button" id="movieSearchBtn" class="movie-search-btn">Search</button>
        <div
          id="movieSuggestionsDropdown"
          class="movie-suggestions-dropdown"
          role="listbox"
          aria-label="TMDB Movie Suggestions"
          aria-hidden="true"
        ></div>
      </div>

      <div id="movieLookupHint" class="movie-lookup-hint" aria-live="polite"></div>

      <input
        type="text"
        id="movieActorInput"
        class="drawer-input"
        placeholder="Lead cast (auto-filled from TMDB)"
        aria-label="Lead actors"
      />

      <input
        type="url"
        id="moviePosterInput"
        class="drawer-input"
        placeholder="Poster URL (auto-filled from TMDB)"
        aria-label="Poster image URL"
      />

      <button type="submit" class="watchlist-submit-btn">+ Add to Watchlist</button>
    </form>

    <div id="watchlistList" class="watchlist-list" role="list" aria-label="Movies"></div>
  </aside>

  <!-- Add Shortcut Modal -->
  <div id="modalOverlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="addShortcutModalTitle" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="addShortcutModalTitle" class="modal-title">Add Shortcut</h3>
        <button type="button" id="modalCloseBtn" class="drawer-close-btn" aria-label="Close modal">×</button>
      </div>

      <form id="addShortcutForm" class="modal-form" autocomplete="off">
        <div class="form-group">
          <label for="shortcutTitleInput" class="form-label">Name</label>
          <input type="text" id="shortcutTitleInput" class="drawer-input" placeholder="e.g. GitHub" />
        </div>

        <div class="form-group">
          <label for="shortcutUrlInput" class="form-label">URL</label>
          <input type="text" id="shortcutUrlInput" class="drawer-input" placeholder="e.g. github.com" required />
        </div>

        <div id="formError" class="form-error" role="alert"></div>

        <div class="modal-actions">
          <button type="button" id="modalCancelBtn" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Playlist Modal -->
  <div id="playlistModalOverlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="addPlaylistModalTitle" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="addPlaylistModalTitle" class="modal-title">Add YouTube Music Playlist</h3>
        <button type="button" id="playlistModalCloseBtn" class="drawer-close-btn" aria-label="Close modal">×</button>
      </div>

      <form id="addPlaylistForm" class="modal-form" autocomplete="off">
        <div class="form-group">
          <label for="playlistTitleInput" class="form-label">Playlist Title</label>
          <input type="text" id="playlistTitleInput" class="drawer-input" placeholder="e.g. VELVET & SYNTH" required />
        </div>

        <div class="form-group">
          <label for="playlistUrlInput" class="form-label">YouTube Music URL</label>
          <input type="url" id="playlistUrlInput" class="drawer-input" placeholder="https://music.youtube.com/playlist?list=..." required />
        </div>

        <div class="form-group">
          <label for="playlistCoverUrlInput" class="form-label">Cover Image URL (optional)</label>
          <input type="text" id="playlistCoverUrlInput" class="drawer-input" placeholder="assets/cover.jpg or https://..." />
        </div>

        <div class="form-group">
          <label class="form-label">Or Upload Local Cover</label>
          <div class="file-upload-row">
            <label for="playlistCoverFileInput" class="popover-mini-btn" style="flex: 0 0 auto;">Choose File</label>
            <input type="file" id="playlistCoverFileInput" accept="image/*" hidden />
            <span id="playlistFileStatus" class="file-status-text">No file chosen</span>
          </div>
        </div>

        <div id="playlistFormError" class="form-error" role="alert"></div>

        <div class="modal-actions">
          <button type="button" id="playlistModalCancelBtn" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Add Playlist</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
