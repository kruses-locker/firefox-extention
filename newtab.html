<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Custom Wallpaper Layer & Contrast Scrim -->
  <div class="wallpaper-layer" id="wallpaperLayer" aria-hidden="true"></div>
  <div class="wallpaper-scrim" id="wallpaperScrim" aria-hidden="true"></div>

  <!-- Ambient organic radial warmth -->
  <div class="radial-warmth" aria-hidden="true"></div>

  <!-- Top-Left Watchlist Toggle -->
  <button type="button" class="top-corner-btn watchlist-trigger" id="watchlistTrigger" aria-label="Open Movie Watchlist" aria-expanded="false" aria-controls="watchlistDrawer">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2" y="4" width="20" height="16" rx="2.5"></rect>
      <line x1="7" y1="4" x2="7" y2="20"></line>
      <line x1="17" y1="4" x2="17" y2="20"></line>
      <line x1="2" y1="9" x2="7" y2="9"></line>
      <line x1="2" y1="15" x2="7" y2="15"></line>
      <line x1="17" y1="9" x2="22" y2="9"></line>
      <line x1="17" y1="15" x2="22" y2="15"></line>
    </svg>
    <span class="watchlist-trigger-text">Watchlist</span>
    <span class="watchlist-trigger-dot" aria-hidden="true">•</span>
    <span class="watchlist-count" id="watchlistCount">0</span>
  </button>

  <!-- Top-Right Theme Switcher -->
  <div class="theme-switcher-wrap" id="themeSwitcherWrap">
    <button type="button" class="top-corner-btn theme-trigger" id="themeTrigger" aria-label="Theme and Accent Color" aria-expanded="false" aria-controls="themePopover" title="Customize Theme">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="13.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"></circle>
        <circle cx="17.5" cy="10.5" r="1.5" fill="currentColor" stroke="none"></circle>
        <circle cx="8.5" cy="7.5" r="1.5" fill="currentColor" stroke="none"></circle>
        <circle cx="6.5" cy="12.5" r="1.5" fill="currentColor" stroke="none"></circle>
        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path>
      </svg>
      <span class="theme-trigger-dot" id="themeTriggerDot" aria-hidden="true"></span>
    </button>

    <div class="theme-popover" id="themePopover" role="dialog" aria-label="Theme Switcher" aria-hidden="true">
      <div class="theme-popover-header">
        <span class="theme-popover-title">Appearance</span>
      </div>
      <div class="theme-presets-list" id="themePresetsList" role="radiogroup" aria-label="Color Themes">
        <!-- Rendered dynamically by script.js -->
      </div>
      <div class="theme-custom-row">
        <label for="customAccentInput" class="theme-custom-label">Custom Accent</label>
        <div class="theme-color-picker-wrap">
          <span class="theme-color-hex" id="customAccentHex">#e11d48</span>
          <input type="color" id="customAccentInput" class="theme-color-input" value="#e11d48" aria-label="Pick custom accent color">
        </div>
      </div>

      <!-- Custom Wallpaper Section -->
      <div class="popover-section">
        <div class="theme-popover-header">
          <span class="theme-popover-title">Custom Wallpaper</span>
        </div>
        <div class="wallpaper-actions-row">
          <label for="wallpaperFileInput" class="popover-action-btn" id="wallpaperUploadLabel">
            <span>Upload Image</span>
          </label>
          <input type="file" id="wallpaperFileInput" class="visually-hidden-input" accept="image/*">
          <button type="button" class="popover-action-btn popover-action-secondary" id="wallpaperClearBtn">Clear</button>
        </div>
        <div class="wallpaper-slider-group">
          <div class="wallpaper-slider-header">
            <label for="wallpaperDimInput" class="wallpaper-slider-label">Dim Overlay</label>
            <span class="wallpaper-slider-value" id="wallpaperDimValue">55%</span>
          </div>
          <input type="range" id="wallpaperDimInput" class="wallpaper-range" min="0" max="85" step="1" value="55">
        </div>
        <div class="wallpaper-slider-group">
          <div class="wallpaper-slider-header">
            <label for="wallpaperBlurInput" class="wallpaper-slider-label">Backdrop Blur</label>
            <span class="wallpaper-slider-value" id="wallpaperBlurValue">2px</span>
          </div>
          <input type="range" id="wallpaperBlurInput" class="wallpaper-range" min="0" max="16" step="1" value="2">
        </div>
      </div>

      <!-- Backup & Restore Section -->
      <div class="popover-section">
        <div class="theme-popover-header">
          <span class="theme-popover-title">Backup &amp; Restore</span>
        </div>
        <div class="wallpaper-actions-row">
          <button type="button" class="popover-action-btn" id="backupExportBtn">Export JSON</button>
          <button type="button" class="popover-action-btn popover-action-secondary" id="backupImportBtn">Import JSON</button>
          <input type="file" id="backupImportInput" class="visually-hidden-input" accept=".json,application/json">
        </div>
      </div>
    </div>
  </div>

  <main class="tab-viewport">
    <!-- 1. Signature Overlapping Rainmeter-Style Clock -->
    <section class="clock-section" aria-label="Clock">
      <div class="clock-stage">
        <div class="clock-time" id="clockTime">00:00</div>
        <div class="clock-day" id="clockDay">Thursday</div>
      </div>
      <div class="clock-date" id="clockDate">19 November 2026</div>
    </section>

    <!-- 2. Minimalist DuckDuckGo Search Bar -->
    <section class="search-section" aria-label="Web Search">
      <form class="search-form" id="searchForm" autocomplete="off" role="search">
        <div class="search-bar">
          <div class="search-icon-wrap" title="DuckDuckGo">
            <!-- Warm-tinted DuckDuckGo Icon -->
            <svg class="ddg-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.8 6.5c-.8-.4-1.8-.5-2.7-.2-1.1.4-1.8 1.5-2 2.7-.1.6 0 1.2.3 1.8-.6-.1-1.2 0-1.7.2-.8.4-1.4 1.2-1.5 2.1-.1 1 .4 2 1.2 2.6 1 .6 2.2.1 2.9-.7.1-.1.3-.3.4-.4.4.5.9.8 1.5.8 1 0 1.9-.5 2.3-1.3.5-.8.5-1.9.2-2.7l-.1-.3c.7-.6 1.2-1.5 1.2-2.6 0-1-.8-1.9-1.7-2.1l-.2.1z"/>
            </svg>
          </div>

          <input 
            type="text" 
            class="search-input" 
            id="searchInput" 
            placeholder="Search DuckDuckGo or enter URL..." 
            aria-label="Search DuckDuckGo or enter URL" 
            autofocus 
            spellcheck="false"
          >

          <span class="search-engine-badge" id="searchEngineBadge" aria-live="polite"></span>

          <button type="submit" class="search-submit-btn" id="searchSubmitBtn" aria-label="Search or Navigate" title="Submit">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>
      </form>
    </section>

    <!-- 3. Clean Borderless Shortcut Grid -->
    <section class="shortcuts-section" aria-label="Shortcuts">
      <div class="shortcuts-grid" id="shortcutsGrid" role="list">
        <!-- Rendered dynamically by script.js -->
      </div>
    </section>

    <!-- 4. YouTube Music Playlist Shelf -->
    <section class="playlists-section" aria-label="YouTube Music Playlists">
      <div class="playlists-shelf" id="playlistsShelf" role="list">
        <!-- Rendered dynamically by script.js from YTM_PLAYLISTS config -->
      </div>
    </section>
  </main>

  <!-- 5. YouTube Music Live Mini-Player (Bottom-Center) -->
  <aside class="ytm-mini-player" id="ytmMiniPlayer" aria-label="YouTube Music Live Mini-Player">
    <!-- Rendered dynamically by script.js -->
  </aside>

  <!-- Add Shortcut Minimalist Modal -->
  <div class="modal-overlay" id="modalOverlay" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Add Shortcut</h2>
        <button type="button" class="modal-close-btn" id="modalCloseBtn" aria-label="Close dialog">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <form class="modal-form" id="addShortcutForm">
        <div class="form-group">
          <label for="shortcutTitleInput" class="form-label">Name</label>
          <input 
            type="text" 
            id="shortcutTitleInput" 
            class="form-input" 
            placeholder="e.g. GitHub" 
            maxlength="32" 
            required
          >
        </div>

        <div class="form-group">
          <label for="shortcutUrlInput" class="form-label">Web Address (URL)</label>
          <input 
            type="text" 
            id="shortcutUrlInput" 
            class="form-input" 
            placeholder="e.g. github.com" 
            required
          >
          <div class="form-error" id="formError"></div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="modalCancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="modalSaveBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Playlist Minimalist Modal -->
  <div class="modal-overlay" id="playlistModalOverlay" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="playlistModalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title" id="playlistModalTitle">Add Playlist</h2>
        <button type="button" class="modal-close-btn" id="playlistModalCloseBtn" aria-label="Close dialog">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <form class="modal-form" id="addPlaylistForm" autocomplete="off">
        <div class="form-group">
          <label for="playlistTitleInput" class="form-label">Playlist Name</label>
          <input
            type="text"
            id="playlistTitleInput"
            class="form-input"
            placeholder="e.g. LATE NIGHT JAZZ"
            maxlength="48"
            required
          >
        </div>

        <div class="form-group">
          <label for="playlistUrlInput" class="form-label">YouTube Music Playlist URL</label>
          <input
            type="url"
            id="playlistUrlInput"
            class="form-input"
            placeholder="https://music.youtube.com/playlist?list=..."
            required
          >
        </div>

        <div class="form-group">
          <label for="playlistCoverUrlInput" class="form-label">Cover Image (URL or Local File)</label>
          <input
            type="url"
            id="playlistCoverUrlInput"
            class="form-input"
            placeholder="Paste image URL (optional)"
          >
          <div class="playlist-file-row">
            <label for="playlistCoverFileInput" class="playlist-file-label">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
              </svg>
              <span>Choose local image</span>
            </label>
            <input
              type="file"
              id="playlistCoverFileInput"
              class="playlist-file-input"
              accept="image/*"
            >
            <span class="playlist-file-status" id="playlistFileStatus">No file chosen</span>
          </div>
          <div class="form-error" id="playlistFormError"></div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="playlistModalCancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="playlistModalSaveBtn">Add</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Slide-Over Movie Watchlist Drawer -->
  <div class="drawer-backdrop" id="watchlistBackdrop" aria-hidden="true"></div>
  <aside class="watchlist-drawer" id="watchlistDrawer" role="dialog" aria-modal="true" aria-labelledby="watchlistDrawerTitle" aria-hidden="true">
    <div class="drawer-header">
      <h2 class="drawer-title" id="watchlistDrawerTitle">Movie Watchlist</h2>
      <button type="button" class="modal-close-btn" id="watchlistCloseBtn" aria-label="Close watchlist">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="watchlist-tabs" role="tablist" aria-label="Watchlist Filter">
      <button type="button" class="watchlist-tab active" id="tabToWatch" role="tab" aria-selected="true" data-tab="to-watch">
        <span>To Watch</span>
        <span class="tab-count" id="toWatchTabCount">0</span>
      </button>
      <button type="button" class="watchlist-tab" id="tabWatched" role="tab" aria-selected="false" data-tab="watched">
        <span>Watched</span>
        <span class="tab-count" id="watchedTabCount">0</span>
      </button>
    </div>

    <form class="watchlist-add-form" id="watchlistAddForm" autocomplete="off">
      <div class="watchlist-search-wrap" id="watchlistSearchWrap">
        <div class="watchlist-form-row watchlist-title-search-row">
          <input type="text" id="movieTitleInput" class="watchlist-input" placeholder="Movie name *" maxlength="80" required aria-label="Movie Name">
          <button type="button" class="btn btn-secondary watchlist-search-btn" id="movieSearchBtn">Search</button>
        </div>
        <div class="movie-suggestions-dropdown" id="movieSuggestionsDropdown" role="listbox" aria-label="Movie suggestions" aria-hidden="true"></div>
      </div>
      <div class="watchlist-form-row watchlist-form-row-single">
        <input type="text" id="movieActorInput" class="watchlist-input" placeholder="Lead actor(s) / Director" maxlength="80" aria-label="Lead Actor">
      </div>
      <div class="watchlist-form-row watchlist-form-row-bottom">
        <input type="url" id="moviePosterInput" class="watchlist-input" placeholder="Poster image URL (optional)" aria-label="Poster Image URL">
        <button type="submit" class="btn btn-primary watchlist-add-btn" id="movieAddBtn">Add</button>
      </div>
      <div class="movie-lookup-hint" id="movieLookupHint" aria-live="polite"></div>
    </form>

    <div class="watchlist-list" id="watchlistList" role="list">
      <!-- Rendered dynamically by script.js -->
    </div>
  </aside>

  <!-- Notification Toast Container -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- Main WebExtension Script -->
  <script src="script.js"></script>
</body>
</html>
